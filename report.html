<!DOCTYPE html>
<html>
  <head>
    <title>Report Issue</title>
  </head>

  <body bgcolor="#f2f2f2">
    <center>
      <table width="50%" bgcolor="white" cellpadding="20">
        <tr>
          <td>
            <center>
              <font size="6"><b>🧾 Report a Civic Issue</b></font>
            </center>
            <hr />

            <form>
              <b>Issue Title</b><br />
              <input type="text" size="40" /><br /><br />

              <b>Category</b><br />
              <select>
                <option>Road</option>
                <option>Garbage</option>
                <option>Water</option>
                <option>Electricity</option></select
              ><br /><br />

              <b>Description</b><br />
              <textarea rows="4" cols="40"></textarea><br /><br />

              <b>Location</b><br />
              <input type="text" size="40" /><br /><br />

              <b>Upload Image</b><br />
              <input type="file" /><br /><br />

              <center>
                <input type="submit" value="Submit Issue" />
              </center>
            </form>

            <hr />
            <center><a href="index.html">⬅ Back to Home</a></center>
          </td>
        </tr>
      </table>
    </center>
  </body>
</html>
